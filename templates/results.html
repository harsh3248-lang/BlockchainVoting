<!DOCTYPE html>
<html>

<head>
    <title>Results</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Election Results</h1>

    {% for candidate in candidates %}

    <div class="result">

        <h2>{{ candidate[1] }}</h2>

        <p>
            Votes: {{ candidate[2] }}
        </p>

    </div>

    {% endfor %}

    <a href="/blockchain">
        View Blockchain
    </a>

    <br><br>

    <a href="/">
        Login
    </a>

</div>

</body>

</html>
