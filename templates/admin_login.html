<!DOCTYPE html>
<html>

<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🔐 Admin Login</h1>

    <p style="text-align: center;">
        Election Administration Panel
    </p>

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Admin Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Admin Password"
            required
        >

        <button type="submit">
            Login as Admin
        </button>

    </form>

    <br>

    <p style="text-align: center;">
        <a href="/">← Back to Voter Login</a>
    </p>

</div>

</body>

</html>
