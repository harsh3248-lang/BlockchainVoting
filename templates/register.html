<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Voter Registration</h1>

    <form method="POST">

        <input
            type="text"
            name="voter_id"
            placeholder="Voter ID"
            required
        >

        <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already registered?
        <a href="/">Login</a>
    </p>

</div>

</body>

</html>
