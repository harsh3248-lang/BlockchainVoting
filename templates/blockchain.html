<!DOCTYPE html>
<html>

<head>
    <title>Blockchain</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>Blockchain</h1>

    <h2>
        Chain Status:
        {% if valid %}
            ✅ Valid
        {% else %}
            ❌ Invalid
        {% endif %}
    </h2>

    {% for block in blockchain %}

    <div class="block">

        <h2>Block {{ block.index }}</h2>

        <p>
            <strong>Data:</strong>
            {{ block.data }}
        </p>

        <p>
            <strong>Previous Hash:</strong>
            {{ block.previous_hash }}
        </p>

        <p>
            <strong>Hash:</strong>
            {{ block.hash }}
        </p>

        <p>
            <strong>Nonce:</strong>
            {{ block.nonce }}
        </p>

    </div>

    {% endfor %}

    <a href="/results">
        Back to Results
    </a>

</div>

</body>

</html>
